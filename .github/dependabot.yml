version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Everything here is dev tooling - nothing but highlight.js ships in the
      # extension - so batch it into one reviewable PR rather than a stream.
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
